<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#47aacb" />
    <title>Luisa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/moo.riv" as="fetch" crossorigin />
  </head>
  <body>
    <main id="sea" class="sea">
      <div class="water" aria-hidden="true"></div>
      <div class="moon" aria-hidden="true"></div>
      <div class="rays" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <canvas id="specks" class="specks" aria-hidden="true"></canvas>
      <div id="seabed" class="seabed"></div>

      <div
        id="moo"
        class="moo"
        role="img"
        aria-label="Luisa, a small sea cow, floating in the water"
      >
        <canvas></canvas>
      </div>
      <div id="fx" class="fx-layer" aria-hidden="true"></div>

      <aside class="card">
        <p class="feeling" aria-live="polite">Luisa is feeling: <b id="mood">…</b></p>
        <dl>
          <div>
            <dt>Seagrass eaten</dt>
            <dd id="seagrass">0</dd>
          </div>
          <div>
            <dt>Boops received</dt>
            <dd id="boops">0</dd>
          </div>
        </dl>
        <p id="days" class="days"></p>
      </aside>

      <nav class="toolbar">
        <button id="feed" type="button" class="feed">
          <span aria-hidden="true">🥬</span> Feed Luisa
        </button>
        <p class="hint">boop her nose · rub her belly · pet her back</p>
      </nav>
      <div id="toast" class="toast" role="status"></div>

      <dialog id="note" class="note">
        <form method="dialog" class="paper">
          <span id="note-icon" class="note-icon" aria-hidden="true">🐚</span>
          <p id="note-heading" class="note-heading">A tiny note</p>
          <p id="note-text" class="note-text"></p>
          <p id="note-sign" class="note-sign"></p>
          <button type="submit" class="note-close">close ♡</button>
        </form>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
